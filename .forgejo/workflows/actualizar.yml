name: Actualizar GeoJSON

on:
  schedule:
    - cron: "0 5 * * 1" # lunes 05:00 UTC
  workflow_dispatch:

jobs:
  actualizar:
    # Runner en España: varias fuentes bloquean IPs extranjeras.
    runs-on: linux-amd64
    # La etiqueta usa Docker; imagen oficial de Python (trae git, sin PEP 668).
    container:
      image: python:3.12-bookworm
    steps:
      # ponytail: checkout con git en vez de actions/checkout, que exige node en la imagen.
      # El token automático (válido solo durante el job) da escritura al repo para el push.
      - name: Checkout
        run: |
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.extraHeader "Authorization: basic $(printf 'x-access-token:%s' "$FORGEJO_TOKEN" | base64 -w0)"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -qf FETCH_HEAD
      - run: python --version && pip install -q -r requirements.txt
      - run: python scripts/test_comun.py
      # Cada fuente por separado: si una falla, las demás se actualizan igual.
      - run: python scripts/castilla_y_leon.py
        continue-on-error: true
      - run: python scripts/canarias.py
        continue-on-error: true
      - run: python scripts/galicia.py
        continue-on-error: true
      - run: python scripts/andalucia.py
        continue-on-error: true
      - run: python scripts/aragon.py
        continue-on-error: true
      - run: python scripts/asturias.py
        continue-on-error: true
      - run: python scripts/baleares.py
        continue-on-error: true
      - run: python scripts/cantabria.py
        continue-on-error: true
      - run: python scripts/castilla_la_mancha.py
        continue-on-error: true
      - run: python scripts/cataluna.py
        continue-on-error: true
      - run: python scripts/madrid.py
        continue-on-error: true
      - run: python scripts/valencia.py
        continue-on-error: true
      - run: python scripts/extremadura.py
        continue-on-error: true
      - run: python scripts/rioja.py
        continue-on-error: true
      - run: python scripts/murcia.py
        continue-on-error: true
      - run: python scripts/navarra.py
        continue-on-error: true
      - run: python scripts/pais_vasco.py
        continue-on-error: true
      - name: Commit si hay cambios
        run: |
          git add -A '*/centros.geojson' 'scripts/cache/*.json'
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "forgejo-actions"
          git config user.email "actions@noreply.petricor.net"
          git commit -m "Actualizar centros: $(git diff --cached --name-only | xargs -n1 dirname | paste -sd ', ' -)"
          git push origin "HEAD:$GITHUB_REF_NAME"
